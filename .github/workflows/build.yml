name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build j3ds
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bannertool from source
        run: |
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cd /tmp/bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          install -Dm755 build/bannertool /usr/local/bin/bannertool

      - name: Build makerom from source
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/makerom
          cd /tmp/makerom/makerom
          make deps
          make program
          install -Dm755 bin/makerom /usr/local/bin/makerom

      - name: Build j3ds
        run: |
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j3ds-build
          path: |
            j3ds.3dsx
            j3ds.cia
            j3ds.smdh

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: j3ds-build

      - name: Generate QR code for .cia download
        uses: snow-actions/qrcode@v2.0.0
        with:
          text: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/j3ds.cia
          path: qrcode-j3ds.png

      - name: Generate release notes with embedded QR code
        run: |
          cat > release-notes.md << 'EOF'
          ## Jellyfin 3DS ${{ github.ref_name }}

          Nintendo 3DS / 2DS / New3DS 向け Jellyfin 音楽クライアントです。

          ### インストール

          `.cia` を FBI や godmode9 などでインストールし、HOME メニューから起動してください。
          下記 QR コードを読み取ると、FBI 経由で直接 `.cia` をダウンロードできます。

          ![QR Code for j3ds.cia](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/qrcode-j3ds.png)

          ### ダウンロード

          - [j3ds.cia](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/j3ds.cia)
          - [j3ds.3dsx](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/j3ds.3dsx)

          ### 使い方

          - Home: A=ブラウザ, SELECT=設定, B=プレイヤー, START=終了
          - 設定: ↑/↓=選択, A=編集, X=接続テスト, START=保存, B=戻る
          - ブラウザ: ↑/↓=選択, A=下位階層/曲を再生, B=戻る, L/R=ページ
          - プレイヤー: X=再生, Y=ポーズ/再開, B=停止して戻る
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            j3ds.3dsx
            j3ds.cia
            qrcode-j3ds.png
          body_path: release-notes.md
